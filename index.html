<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>OBMC LP</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        body {
            margin: 0;
            background-color: #eae0c7;
            font-family: Monalisa;
        }
        .phone-container {
            width: 100%;
            max-width: 390px;
            min-height: 100vh;
            margin: 0 auto;
            background-color: #FFF2CD;
            padding: 20px 15px;
            box-sizing: border-box;
        }
        .navbar-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: center;
            gap: 12px;
            background-color: #4c7787;
            padding: 12px 20px;
        }
        h2 {
            text-align: center;
            margin: 0 0 20px;
            background-color: #4c7787;
        }
        h1 img {
            display: flex;
            width: 100%;
            height: auto;
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            background-color: #4c7787;
            padding: 12px 20px;
        }
        .nav-links {
            display: flex;
            flex-wrap: center;
            gap: 12px;
            list-style: none;
            margin: 0;
            padding: 0;
            align-items: center;
            
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="phone-container">
    <h1><img src="ss.jpg" alt="seipsum facit persona"></h1>
    <header class="navbar-container">
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="#home" class="active">Home</a></li>
                <li><a href="#Courses">Courses</a></li>
                <li><a href="#Enroll Now">Enroll Now</a></li>
                <li><a href="#Contact Us">Contact Us</a></li>
                <li><a href="#About us">About Us</a></li>
            </ul> 
            </nav>
    </header>
    </div>
</body>
</html>
